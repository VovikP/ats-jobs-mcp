<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="tri" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <clipPath id="delta">
      <path d="M256 100 L408 376 H104 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- delta: the sign for change -->
  <path d="M256 100 L408 376 H104 Z" fill="url(#tri)"/>

  <!-- diff line, clipped to the delta so the edges stay clean -->
  <g clip-path="url(#delta)">
    <rect x="90" y="288" width="332" height="30" fill="#0B1220"/>
    <rect x="168" y="297" width="66" height="12" rx="6" fill="#4ADE80"/>
    <rect x="278" y="297" width="66" height="12" rx="6" fill="#64748B"/>
  </g>
</svg>
